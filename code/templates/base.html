{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ system_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'vendor/pico-2.0.6/pico.min.css' %}">
</head>
<body>
    <header class="container">
        <nav>
            <ul>
                <li><strong>{{ system_name }}</strong></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
